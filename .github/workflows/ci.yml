name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  RUSTARMIC_URL: https://github.com/nexium-emu/rustarmic.git
  RUSTARMIC_REF: main
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_SIGNING_FINGERPRINT: FCF986EA15E6E293A5644F10B4322F04D67658D8

jobs:
  build:
    name: NeXium (${{ matrix.target }})
    runs-on: [ self-hosted, "${{ matrix.runner }}" ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: nexium-linux
            asset: linux-x86_64
          - target: windows
            runner: nexium-win
            asset: windows-x86_64
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7

      - name: Fetch rustarmic (CPU JIT dependency)
        shell: bash
        env:
          RUSTARMIC_TOKEN: ${{ secrets.RUSTARMIC_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf ../rustarmic
          if [ -n "$RUSTARMIC_TOKEN" ]; then
            git clone --depth 1 --branch "$RUSTARMIC_REF" \
              "https://x-access-token:${RUSTARMIC_TOKEN}@github.com/nexium-emu/rustarmic.git" ../rustarmic
          else
            git clone --depth 1 --branch "$RUSTARMIC_REF" "$RUSTARMIC_URL" ../rustarmic
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake gnupg nasm ninja-build pkg-config xz-utils \
            libgtk-3-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libboost-dev

      - name: Locate Boost (Windows, for Dynarmic)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          WINROOT="${BOOST_ROOT:-C:\boost}"
          UNIXROOT="${WINROOT//\\//}"
          case "$UNIXROOT" in
            [A-Za-z]:/*) UNIXROOT="/$(printf '%s' "${UNIXROOT%%:*}" | tr 'A-Z' 'a-z')${UNIXROOT#*:}" ;;
          esac
          test -f "$UNIXROOT/boost/version.hpp" || { echo "::error::no Boost headers at $WINROOT (set BOOST_ROOT on the runner)"; exit 1; }
          grep -m1 '#define BOOST_LIB_VERSION' "$UNIXROOT/boost/version.hpp" | sed 's/^/using /'
          echo "BOOST_ROOT=$WINROOT" >> "$GITHUB_ENV"

      - name: Build NeXium
        shell: bash
        run: cargo build --release -p nexium-gui --bin nexium

      - name: Configure MSVC for FFmpeg
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install FFmpeg build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: diffutils gnupg make nasm perl

      - name: Build bundled FFmpeg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Build bundled FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/NeXium
          cp target/release/nexium dist/NeXium/
          cp LICENSE README.md dist/NeXium/
          cp -a "${RUNNER_TEMP}/nexium-ffmpeg-dist/." dist/NeXium/
          test -x dist/NeXium/ffmpeg
          test -f dist/NeXium/THIRD_PARTY_NOTICES.txt
          test -f dist/NeXium/licenses/FFmpeg/LICENSE.md
          test -f dist/NeXium/licenses/FFmpeg/COPYING.LGPLv2.1
          test -f dist/NeXium/licenses/FFmpeg/BUILD.txt
          test -f dist/NeXium/licenses/FFmpeg/ffmpeg-${FFMPEG_VERSION}.tar.xz
          test -f dist/NeXium/licenses/FFmpeg/ffmpeg-${FFMPEG_VERSION}.tar.xz.asc
          test -f dist/NeXium/licenses/FFmpeg/ffmpeg-devel.asc
          test -f dist/NeXium/licenses/FFmpeg/CHANGES.diff
          tar -C dist -czf "dist/nexium-${{ matrix.asset }}.tar.gz" NeXium

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/NeXium | Out-Null
          Copy-Item target/release/nexium.exe dist/NeXium/
          Copy-Item LICENSE, README.md dist/NeXium/
          $ffmpegDist = Join-Path $env:RUNNER_TEMP 'nexium-ffmpeg-dist'
          Copy-Item (Join-Path $ffmpegDist '*') dist/NeXium/ -Recurse
          $required = @(
            'dist/NeXium/ffmpeg.exe',
            'dist/NeXium/THIRD_PARTY_NOTICES.txt',
            "dist/NeXium/licenses/FFmpeg/ffmpeg-$env:FFMPEG_VERSION.tar.xz",
            "dist/NeXium/licenses/FFmpeg/ffmpeg-$env:FFMPEG_VERSION.tar.xz.asc",
            'dist/NeXium/licenses/FFmpeg/ffmpeg-devel.asc',
            'dist/NeXium/licenses/FFmpeg/LICENSE.md',
            'dist/NeXium/licenses/FFmpeg/COPYING.LGPLv2.1',
            'dist/NeXium/licenses/FFmpeg/BUILD.txt',
            'dist/NeXium/licenses/FFmpeg/CHANGES.diff'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged FFmpeg file: $path"
            }
          }
          Compress-Archive -Path dist/NeXium/* -DestinationPath "dist/nexium-${{ matrix.asset }}.zip"

      - name: Resolve shared artifact drop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT=/c/nexium-ci-artifacts
          else
            ROOT=/mnt/c/nexium-ci-artifacts
          fi
          DROP="$ROOT/${{ github.run_id }}"
          mkdir -p "$DROP"
          echo "DROP=$DROP" >> "$GITHUB_ENV"
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true

      - name: Hand off package to shared drop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/nexium-${{ matrix.asset }}.*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no package produced"; exit 1; }
          cp -f "${files[@]}" "$DROP/"
          ls -l "$DROP"

  android:
    name: NeXium APK (arm64-v8a)
    runs-on: [ self-hosted, Linux, X64, nexium-linux ]
    env:
      BUILD_TOOLS_VERSION: "35.0.0"
      MIN_SDK: "26"
      TARGET_SDK: "34"
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7

      - name: Stub rustarmic (optional path dependency, not built for Android)
        run: |
          mkdir -p ../rustarmic/src
          printf '[package]\nname = "rustarmic"\nversion = "0.1.0"\nedition = "2021"\n' > ../rustarmic/Cargo.toml
          : > ../rustarmic/src/lib.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libboost-dev

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-${{ env.TARGET_SDK }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}

      - name: Export Android environment
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$NDK" || { echo "::error::no Android NDK on the runner"; exit 1; }
          echo "using NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          BOOST_STAGE="$RUNNER_TEMP/boost-headers"
          mkdir -p "$BOOST_STAGE"
          ln -sfn /usr/include/boost "$BOOST_STAGE/boost"
          test -f "$BOOST_STAGE/boost/icl/interval_map.hpp"
          echo "BOOST_ROOT=$BOOST_STAGE" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-$TARGET_SDK/android.jar" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo ndk -t arm64-v8a --platform "$MIN_SDK" build --release -p nexium-android

      - name: Stage native libraries
        run: |
          set -euo pipefail
          STAGE=target/android-apk
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib/arm64-v8a"
          cp target/aarch64-linux-android/release/libnexium_android.so "$STAGE/lib/arm64-v8a/"
          cp "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             "$STAGE/lib/arm64-v8a/"

      - name: Verify no unresolved Dynarmic symbols
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=target/android-apk/lib/arm64-v8a/libnexium_android.so
          UND=$("$READELF" --dyn-syms "$SO" | awk '$7=="UND" {print $8}' | grep -c "Dynarmic" || true)
          echo "unresolved Dynarmic symbols: $UND"
          if [ "$UND" -ne 0 ]; then
            echo "::error::libnexium_android.so has unresolved Dynarmic symbols; it would fail dlopen on device"
            "$READELF" --dyn-syms "$SO" | awk '$7=="UND" {print $8}' | grep "Dynarmic" || true
            exit 1
          fi

      - name: Verify 16 KB page alignment
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=target/android-apk/lib/arm64-v8a/libnexium_android.so
          BAD=$("$READELF" -l "$SO" | awk '$1=="LOAD" {print $NF}' | grep -cv "0x4000" || true)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::LOAD segments are not 16 KB aligned; the app will not load on 16 KB-page devices"
            "$READELF" -l "$SO" | grep LOAD
            exit 1
          fi

      - name: Package APK
        run: |
          set -euo pipefail
          STAGE=target/android-apk
          "$BUILD_TOOLS/aapt2" compile --dir android/res -o "$STAGE/res.zip"
          "$BUILD_TOOLS/aapt2" link -o "$STAGE/base.apk" \
            --manifest android/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -R "$STAGE/res.zip" \
            --auto-add-overlay \
            --min-sdk-version "$MIN_SDK" \
            --target-sdk-version "$TARGET_SDK"
          (cd "$STAGE" && jar --update --file base.apk \
            lib/arm64-v8a/libnexium_android.so lib/arm64-v8a/libc++_shared.so)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$STAGE/base.apk" "$STAGE/aligned.apk"

      - name: Sign APK
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android" dist
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" \
            --ks-pass pass:android --key-pass pass:android \
            --out dist/nexium-android-arm64.apk target/android-apk/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/nexium-android-arm64.apk

      - name: Resolve shared artifact drop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT=/c/nexium-ci-artifacts
          else
            ROOT=/mnt/c/nexium-ci-artifacts
          fi
          DROP="$ROOT/${{ github.run_id }}"
          mkdir -p "$DROP"
          echo "DROP=$DROP" >> "$GITHUB_ENV"
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true

      - name: Hand off APK to shared drop
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/nexium-android-arm64.apk
          cp -f dist/nexium-android-arm64.apk "$DROP/"
          ls -l "$DROP"

  ps5:
    name: NeXium (ps5)
    runs-on: [ self-hosted, Linux, X64, nexium-linux ]
    env:
      PS5_STACK: /opt/ps5/stack
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7

      - name: Fetch rustarmic (CPU JIT dependency)
        shell: bash
        env:
          RUSTARMIC_TOKEN: ${{ secrets.RUSTARMIC_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf ../rustarmic
          if [ -n "$RUSTARMIC_TOKEN" ]; then
            git clone --depth 1 --branch "$RUSTARMIC_REF" \
              "https://x-access-token:${RUSTARMIC_TOKEN}@github.com/nexium-emu/rustarmic.git" ../rustarmic
          else
            git clone --depth 1 --branch "$RUSTARMIC_REF" "$RUSTARMIC_URL" ../rustarmic
          fi

      - name: Locate PS5 stack
        shell: bash
        run: |
          set -euo pipefail
          vulkan="$PS5_STACK/PS5_Vulkan"
          for file in \
            "$vulkan/.deps/native/ps5-payload-sdk/bin/prospero-lld" \
            "$vulkan/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a" \
            "$vulkan/build/host/ps5-native-tool" \
            "$vulkan/runtime/libc.prx" \
            /usr/include/boost/version.hpp; do
            test -e "$file" || { echo "::error::missing $file (run nexium-ps5/tools/setup-stack.sh once on the runner)"; exit 1; }
          done
          git -c safe.directory="$vulkan" -C "$vulkan" rev-parse --short HEAD | sed 's/^/PS5_Vulkan at /'

      - name: Read pinned Rust toolchain
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' nexium-ps5/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rust-src

      - name: Build and package PS5 title
        shell: bash
        run: |
          set -euo pipefail
          work="$HOME/nexium-ps5-ci"
          mkdir -p "$work/out" "$work/deps"
          export NEXIUM_PS5_TARGET_DIR="$work/target"
          export NEXIUM_PS5_OUT="$work/out"
          export PS5_DEPS="$work/deps"
          export BUILD_LOG="$work/out/build.log"
          rm -rf dist/ps5
          bash nexium-ps5/tools/package.sh "$PWD/dist/ps5" || { tail -n 80 "$BUILD_LOG"; exit 1; }
          zip=$(ls dist/ps5/NeXium-PPSA*.zip)
          test -f dist/ps5/PPSA99640/eboot.bin
          test -f dist/ps5/PPSA99640/sce_module/libc.prx
          test -f dist/ps5/PPSA99640/sce_sys/param.json
          cp -f "$zip" dist/nexium-ps5.zip
          ls -l dist/nexium-ps5.zip

      - name: Resolve shared artifact drop
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/mnt/c/nexium-ci-artifacts
          DROP="$ROOT/${{ github.run_id }}"
          mkdir -p "$DROP"
          echo "DROP=$DROP" >> "$GITHUB_ENV"
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true

      - name: Hand off package to shared drop
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/nexium-ps5.zip
          cp -f dist/nexium-ps5.zip "$DROP/"
          ls -l "$DROP"

  release:
    name: Pre-release
    needs: [build, android, ps5]
    if: github.event_name != 'pull_request'
    runs-on: [ self-hosted, Linux, X64, nexium-linux ]
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Collect artifacts from shared drop
        shell: bash
        run: |
          set -euo pipefail
          DROP="/mnt/c/nexium-ci-artifacts/${{ github.run_id }}"
          test -d "$DROP" || { echo "::error::no drop directory for this run"; exit 1; }
          mkdir -p artifacts
          cp -f "$DROP"/* artifacts/
          for f in nexium-linux-x86_64.tar.gz nexium-windows-x86_64.zip nexium-android-arm64.apk nexium-ps5.zip; do
            test -f "artifacts/$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls -l artifacts

      - name: Release metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          repository: nexium-emu/nexium-nightly
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: nightly
          name: "NeXium nightly ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          prerelease: true
          body: |
            Automated pre-release built by CI from `main` @ `${{ github.sha }}`.

            **Downloads**
            - Windows (x86_64): `nexium-windows-x86_64.zip`
            - Linux (x86_64): `nexium-linux-x86_64.tar.gz`
            - Android (arm64-v8a): `nexium-android-arm64.apk`
            - PS5 homebrew (PPSA99640 folder for `/data/homebrew/`): `nexium-ps5.zip`

            > Pre-release / experimental.

            NeXium archives bundle the FFmpeg command-line program under the GNU LGPL v2.1 or later. The corresponding unmodified source, license, signature, and build configuration are included in each archive under `licenses/FFmpeg`.
          files: artifacts/**/*

      - name: Notify Discord (#early-access)
        if: env.DISCORD_WEBHOOK != ''
        run: |
          ver="${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          url="https://github.com/nexium-emu/nexium-nightly/releases/tag/nightly"
          payload="$(jq -n --arg ver "$ver" --arg url "$url" '{
            username: "NeXium CI",
            embeds: [ {
              title: ("NeXium nightly " + $ver),
              url: $url,
              description: "A new early-access build is up. Windows and Linux (x86_64) downloads, an Android arm64 APK and a PS5 homebrew build are on the release page.\n\nExperimental — expect bugs.",
              color: 5814783
            } ]
          }')"
          code="$(printf '%s' "$payload" | curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK")"
          echo "Discord webhook HTTP $code"
