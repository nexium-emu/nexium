name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTARMIC_URL: https://github.com/nexium-emu/rustarmic.git
  RUSTARMIC_REF: main

jobs:
  build:
    name: NeXium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
          - os: macos-latest
            asset: macos-arm64
            cargo_flags: "--no-default-features --features backend-rustarmic"
            experimental: true
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v4

      - name: Fetch rustarmic (CPU JIT dependency)
        shell: bash
        env:
          RUSTARMIC_TOKEN: ${{ secrets.RUSTARMIC_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          if [ -n "$RUSTARMIC_TOKEN" ]; then
            git clone --depth 1 --branch "$RUSTARMIC_REF" \
              "https://x-access-token:${RUSTARMIC_TOKEN}@github.com/nexium-emu/rustarmic.git" ../rustarmic
          else
            git clone --depth 1 --branch "$RUSTARMIC_REF" "$RUSTARMIC_URL" ../rustarmic
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libboost-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          RT="$(find "$(dirname "$(xcrun --find clang)")/../lib/clang" -name libclang_rt.osx.a 2>/dev/null | head -1)"
          if [ -n "$RT" ]; then
            echo "Linking clang_rt from: $RT"
            echo "RUSTFLAGS=-L native=$(dirname "$RT") -l static=clang_rt.osx" >> "$GITHUB_ENV"
          fi

      - name: Install Boost (Windows, for Dynarmic)
        if: runner.os == 'Windows'
        id: boost
        uses: MarkusJx/install-boost@v2
        with:
          boost_version: 1.83.0
          platform_version: 2022
          toolset: msvc

      - name: Build NeXium
        shell: bash
        env:
          BOOST_ROOT: ${{ steps.boost.outputs.BOOST_ROOT }}
        run: cargo build --release -p nexium-gui --bin nexium ${{ matrix.cargo_flags }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/NeXium
          cp target/release/nexium dist/NeXium/
          cp LICENSE README.md dist/NeXium/
          tar -C dist -czf "dist/nexium-${{ matrix.asset }}.tar.gz" NeXium

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/NeXium | Out-Null
          Copy-Item target/release/nexium.exe dist/NeXium/
          Copy-Item LICENSE, README.md dist/NeXium/
          Compress-Archive -Path dist/NeXium/* -DestinationPath "dist/nexium-${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexium-${{ matrix.asset }}
          path: dist/nexium-${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    name: Pre-release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          repository: nexium-emu/nexium-nightly
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: nightly
          name: "NeXium nightly ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          prerelease: true
          body: |
            Automated pre-release built by CI from `main` @ `${{ github.sha }}`.

            **Downloads**
            - Windows (x86_64): `nexium-windows-x86_64.zip`
            - Linux (x86_64): `nexium-linux-x86_64.tar.gz`
            - macOS (Apple Silicon): `nexium-macos-arm64.tar.gz`

            > Pre-release / experimental. NeXium is an x86_64-host emulator; the macOS build is the rustarmic backend compiled for Apple Silicon and is provided as a build artifact only (it will not run on Apple Silicon).
          files: artifacts/**/*

      - name: Notify Discord (#early-access)
        if: env.DISCORD_WEBHOOK != ''
        run: |
          ver="${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          url="https://github.com/nexium-emu/nexium-nightly/releases/tag/nightly"
          payload="$(jq -n --arg ver "$ver" --arg url "$url" '{
            username: "NeXium CI",
            embeds: [ {
              title: ("NeXium nightly " + $ver),
              url: $url,
              description: "A new early-access build is up. Windows and Linux (x86_64) downloads are on the release page.\n\nExperimental — expect bugs.",
              color: 5814783
            } ]
          }')"
          code="$(printf '%s' "$payload" | curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK")"
          echo "Discord webhook HTTP $code"
