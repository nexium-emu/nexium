name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_SIGNING_FINGERPRINT: FCF986EA15E6E293A5644F10B4322F04D67658D8
  APPIMAGE_RUNTIME_SHA256: 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
  BOOST_VERSION: 1.87.0
  BOOST_SHA256: f55c340aa49763b1925ccf02b2e83f35fdcf634c9d5164a2acb87540173c741d

jobs:
  build:
    name: NeXium-2 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
            asset: linux-x86_64
          - target: windows
            runner: windows-latest
            asset: windows-x86_64
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake gnupg nasm ninja-build pkg-config xz-utils \
            libgtk-3-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev \
            libboost-dev mesa-vulkan-drivers

      - name: Install Vulkan runtime and Lavapipe (Windows, for GPU tests)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          install_runtime_only: true
          install_lavapipe: true
          cache: true

      - name: Cache Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/boost
          key: boost-headers-${{ env.BOOST_VERSION }}

      - name: Install Boost headers (Windows, for Dynarmic)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          root="$temp/boost"
          if [ ! -f "$root/boost/version.hpp" ]; then
            archive="boost_${BOOST_VERSION//./_}"
            curl -fsSL --retry 3 -o "$temp/boost.tar.gz" "https://archives.boost.io/release/${BOOST_VERSION}/source/${archive}.tar.gz"
            echo "${BOOST_SHA256}  $temp/boost.tar.gz" | sha256sum -c -
            mkdir -p "$root"
            tar --force-local -xzf "$temp/boost.tar.gz" -C "$root" --strip-components=1 "${archive}/boost"
            rm -f "$temp/boost.tar.gz"
          fi
          grep -m1 '#define BOOST_LIB_VERSION' "$root/boost/version.hpp" | sed 's/^/using /'
          echo "BOOST_ROOT=$(cygpath -w "$root")" >> "$GITHUB_ENV"

      - name: Locate CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          WINCMAKE="${CMAKE:-C:\Program Files\CMake\bin\cmake.exe}"
          UNIXCMAKE="${WINCMAKE//\\//}"
          case "$UNIXCMAKE" in
            [A-Za-z]:/*) UNIXCMAKE="/$(printf '%s' "${UNIXCMAKE%%:*}" | tr 'A-Z' 'a-z')${UNIXCMAKE#*:}" ;;
          esac
          test -x "$UNIXCMAKE" || { echo "::error::no Windows CMake at $WINCMAKE (set CMAKE on the runner)"; exit 1; }
          "$UNIXCMAKE" --version | head -n 1
          echo "CMAKE=$WINCMAKE" >> "$GITHUB_ENV"

      - name: Build NeXium
        shell: bash
        run: cargo build --release -p nexium-gui --bin nexium

      - name: Test NeXium
        shell: bash
        timeout-minutes: 120
        env:
          NEXIUM_DATA_ROOT: ${{ runner.temp }}/nexium-test-data
        run: cargo test --release --workspace --no-fail-fast

      - name: Test NeXium libraries with OS waits
        shell: bash
        timeout-minutes: 30
        env:
          NEXIUM_DATA_ROOT: ${{ runner.temp }}/nexium-test-data
          NEXIUM_NO_MONITORED_WAIT: "1"
        run: cargo test --release --workspace --lib --no-fail-fast

      - name: Configure MSVC for FFmpeg
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install FFmpeg build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: diffutils gnupg make nasm perl

      - name: Build bundled FFmpeg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Build bundled FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/NeXium-2
          cp target/release/nexium dist/NeXium-2/
          cp LICENSE README.md dist/NeXium-2/
          cp -a "${RUNNER_TEMP}/nexium-ffmpeg-dist/." dist/NeXium-2/
          test -x dist/NeXium-2/ffmpeg
          test -f dist/NeXium-2/THIRD_PARTY_NOTICES.txt
          test -f dist/NeXium-2/licenses/FFmpeg/LICENSE.md
          test -f dist/NeXium-2/licenses/FFmpeg/COPYING.LGPLv2.1
          test -f dist/NeXium-2/licenses/FFmpeg/BUILD.txt
          test -f dist/NeXium-2/licenses/FFmpeg/ffmpeg-${FFMPEG_VERSION}.tar.xz
          test -f dist/NeXium-2/licenses/FFmpeg/ffmpeg-${FFMPEG_VERSION}.tar.xz.asc
          test -f dist/NeXium-2/licenses/FFmpeg/ffmpeg-devel.asc
          test -f dist/NeXium-2/licenses/FFmpeg/CHANGES.diff
          tar -C dist -czf "dist/nexium-2-${{ matrix.asset }}.tar.gz" NeXium-2

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/NeXium-2 | Out-Null
          Copy-Item target/release/nexium.exe dist/NeXium-2/
          Copy-Item LICENSE, README.md dist/NeXium-2/
          $ffmpegDist = Join-Path $env:RUNNER_TEMP 'nexium-ffmpeg-dist'
          Copy-Item (Join-Path $ffmpegDist '*') dist/NeXium-2/ -Recurse
          $required = @(
            'dist/NeXium-2/ffmpeg.exe',
            'dist/NeXium-2/THIRD_PARTY_NOTICES.txt',
            "dist/NeXium-2/licenses/FFmpeg/ffmpeg-$env:FFMPEG_VERSION.tar.xz",
            "dist/NeXium-2/licenses/FFmpeg/ffmpeg-$env:FFMPEG_VERSION.tar.xz.asc",
            'dist/NeXium-2/licenses/FFmpeg/ffmpeg-devel.asc',
            'dist/NeXium-2/licenses/FFmpeg/LICENSE.md',
            'dist/NeXium-2/licenses/FFmpeg/COPYING.LGPLv2.1',
            'dist/NeXium-2/licenses/FFmpeg/BUILD.txt',
            'dist/NeXium-2/licenses/FFmpeg/CHANGES.diff'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged FFmpeg file: $path"
            }
          }
          Compress-Archive -Path dist/NeXium-2/* -DestinationPath "dist/nexium-2-${{ matrix.asset }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nexium-2-${{ matrix.asset }}
          path: dist/nexium-2-${{ matrix.asset }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  appimage:
    name: NeXium-2 AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build packaging image
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'docker {{.Server.Version}}'
          docker build --quiet -t nexium-appimage-builder:jammy \
            -f .github/docker/appimage.Dockerfile .github/docker

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimage/rust" "$RUNNER_TEMP/appimage/target"
          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/appimage/rust:/opt/rust" \
            -v "$RUNNER_TEMP/appimage/target:/src/target" \
            -e CARGO_TERM_COLOR -e FFMPEG_VERSION -e FFMPEG_SOURCE_SHA256 -e FFMPEG_SIGNING_FINGERPRINT \
            -e APPIMAGE_RUNTIME_SHA256 -e APPIMAGE_ASSET=nexium-2-linux-x86_64.AppImage \
            -w /src nexium-appimage-builder:jammy bash .github/scripts/build-appimage.sh
          test -f dist/nexium-2-linux-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: nexium-2-linux-x86_64-appimage
          path: dist/nexium-2-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 3

  android:
    name: NeXium-2 APK (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS_VERSION: "35.0.0"
      MIN_SDK: "26"
      TARGET_SDK: "34"
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
          cache-on-failure: true

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libboost-dev

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-${{ env.TARGET_SDK }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}

      - name: Export Android environment
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$NDK" || { echo "::error::no Android NDK on the runner"; exit 1; }
          echo "using NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          BOOST_STAGE="$RUNNER_TEMP/boost-headers"
          mkdir -p "$BOOST_STAGE"
          ln -sfn /usr/include/boost "$BOOST_STAGE/boost"
          test -f "$BOOST_STAGE/boost/icl/interval_map.hpp"
          echo "BOOST_ROOT=$BOOST_STAGE" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-$TARGET_SDK/android.jar" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo ndk -t arm64-v8a --platform "$MIN_SDK" build --release -p nexium-android

      - name: Stage native libraries
        run: |
          set -euo pipefail
          STAGE=target/android-apk
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib/arm64-v8a"
          cp target/aarch64-linux-android/release/libnexium_android.so "$STAGE/lib/arm64-v8a/"
          cp "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             "$STAGE/lib/arm64-v8a/"

      - name: Verify no unresolved Dynarmic symbols
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=target/android-apk/lib/arm64-v8a/libnexium_android.so
          UND=$("$READELF" --dyn-syms "$SO" | awk '$7=="UND" {print $8}' | grep -c "Dynarmic" || true)
          echo "unresolved Dynarmic symbols: $UND"
          if [ "$UND" -ne 0 ]; then
            echo "::error::libnexium_android.so has unresolved Dynarmic symbols; it would fail dlopen on device"
            "$READELF" --dyn-syms "$SO" | awk '$7=="UND" {print $8}' | grep "Dynarmic" || true
            exit 1
          fi

      - name: Verify 16 KB page alignment
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SO=target/android-apk/lib/arm64-v8a/libnexium_android.so
          BAD=$("$READELF" -l "$SO" | awk '$1=="LOAD" {print $NF}' | grep -cv "0x4000" || true)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::LOAD segments are not 16 KB aligned; the app will not load on 16 KB-page devices"
            "$READELF" -l "$SO" | grep LOAD
            exit 1
          fi

      - name: Package APK
        run: |
          set -euo pipefail
          STAGE=target/android-apk
          "$BUILD_TOOLS/aapt2" compile --dir android/res -o "$STAGE/res.zip"
          "$BUILD_TOOLS/aapt2" link -o "$STAGE/base.apk" \
            --manifest android/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -R "$STAGE/res.zip" \
            --auto-add-overlay \
            --min-sdk-version "$MIN_SDK" \
            --target-sdk-version "$TARGET_SDK"
          (cd "$STAGE" && jar --update --file base.apk \
            lib/arm64-v8a/libnexium_android.so lib/arm64-v8a/libc++_shared.so)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$STAGE/base.apk" "$STAGE/aligned.apk"

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android" dist
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a new key, so this APK cannot update earlier installs"
          fi
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" \
            --ks-pass pass:android --key-pass pass:android \
            --out dist/nexium-2-android-arm64.apk target/android-apk/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/nexium-2-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nexium-2-android-arm64
          path: dist/nexium-2-android-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  ps5:
    name: NeXium-2 (ps5)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 240
    env:
      PS5_STACK: /opt/ps5/stack
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates

      - name: Checkout NeXium
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache PS5 stack
        uses: actions/cache@v6
        with:
          path: /opt/ps5
          key: ps5-stack-${{ hashFiles('nexium-ps5/tools/setup-stack.sh', 'nexium-ps5/tools/env.sh', 'nexium-ps5/tools/prepare-deps.sh', 'nexium-ps5/rust-toolchain.toml', 'nexium-ps5/patches/**') }}

      - name: Set up PS5 stack
        shell: bash
        run: bash nexium-ps5/tools/setup-stack.sh

      - name: Locate PS5 stack
        shell: bash
        run: |
          set -euo pipefail
          vulkan="$PS5_STACK/PS5_Vulkan"
          for file in \
            "$vulkan/.deps/native/ps5-payload-sdk/bin/prospero-lld" \
            "$vulkan/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a" \
            "$vulkan/build/host/ps5-native-tool" \
            "$vulkan/runtime/libc.prx" \
            /usr/include/boost/version.hpp; do
            test -e "$file" || { echo "::error::missing $file (run nexium-ps5/tools/setup-stack.sh once on the runner)"; exit 1; }
          done
          git -c safe.directory="$vulkan" -C "$vulkan" rev-parse --short HEAD | sed 's/^/PS5_Vulkan at /'

      - name: Read pinned Rust toolchain
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' nexium-ps5/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rust-src

      - name: Build and package PS5 title
        shell: bash
        run: |
          set -euo pipefail
          work="$HOME/nexium-ps5-ci"
          mkdir -p "$work/out" "$work/deps"
          export NEXIUM_PS5_TARGET_DIR="$work/target"
          export NEXIUM_PS5_OUT="$work/out"
          export PS5_DEPS="$work/deps"
          export BUILD_LOG="$work/out/build.log"
          rm -rf dist/ps5
          bash nexium-ps5/tools/package.sh "$PWD/dist/ps5" || { tail -n 80 "$BUILD_LOG"; exit 1; }
          zip=$(ls dist/ps5/NeXium-PPSA*.zip)
          test -f dist/ps5/PPSA99640/eboot.bin
          test -f dist/ps5/PPSA99640/sce_module/libc.prx
          test -f dist/ps5/PPSA99640/sce_sys/param.json
          cp -f "$zip" dist/nexium-2-ps5.zip
          ls -l dist/nexium-2-ps5.zip

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nexium-2-ps5
          path: dist/nexium-2-ps5.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Pre-release
    needs: [build, appimage, android, ps5]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: nexium-2-*
          path: artifacts
          merge-multiple: true

      - name: Check packages
        shell: bash
        run: |
          set -euo pipefail
          for f in nexium-2-linux-x86_64.tar.gz nexium-2-linux-x86_64.AppImage nexium-2-windows-x86_64.zip nexium-2-android-arm64.apk nexium-2-ps5.zip; do
            test -f "artifacts/$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls -l artifacts

      - name: Release metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          repository: nexium-emu/nexium-nightly
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: nightly
          name: "NeXium-2 nightly ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          prerelease: true
          body: |
            Automated NeXium-2 pre-release built by CI from `main` @ `${{ github.sha }}`. NeXium-2 runs Nintendo Switch and Switch 2 titles.

            **Downloads**
            - Windows (x86_64): `nexium-2-windows-x86_64.zip`
            - Linux (x86_64): `nexium-2-linux-x86_64.tar.gz`
            - Linux AppImage (x86_64, Steam Deck): `nexium-2-linux-x86_64.AppImage`
            - Android (arm64-v8a): `nexium-2-android-arm64.apk`
            - PS5 homebrew (PPSA99640 folder for `/data/homebrew/`): `nexium-2-ps5.zip`

            > Pre-release / experimental.

            The AppImage is built against glibc 2.35 and runs on SteamOS 3.5 or newer. Run `chmod +x nexium-2-linux-x86_64.AppImage` after downloading; on a Steam Deck add it in Desktop Mode through "Add a Non-Steam Game" to launch it from Game Mode.

            NeXium-2 archives bundle the FFmpeg command-line program under the GNU LGPL v2.1 or later. The corresponding unmodified source, license, signature, and build configuration are included in each archive under `licenses/FFmpeg`.
          files: artifacts/**/*

      - name: Notify Discord (#early-access)
        if: env.DISCORD_WEBHOOK != ''
        run: |
          ver="${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          url="https://github.com/nexium-emu/nexium-nightly/releases/tag/nightly"
          payload="$(jq -n --arg ver "$ver" --arg url "$url" '{
            username: "NeXium-2 CI",
            embeds: [ {
              title: ("NeXium-2 nightly " + $ver),
              url: $url,
              description: "A new early-access build is up. Windows and Linux (x86_64) downloads, a Linux AppImage for Steam Deck, an Android arm64 APK and a PS5 homebrew build are on the release page.\n\nExperimental — expect bugs.",
              color: 5814783
            } ]
          }')"
          code="$(printf '%s' "$payload" | curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK")"
          echo "Discord webhook HTTP $code"
