name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTARMIC_URL: https://github.com/nexium-emu/rustarmic.git
  RUSTARMIC_REF: main

jobs:
  build:
    name: NeXium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-13 ]
    steps:
      - name: Checkout NeXium
        uses: actions/checkout@v4

      - name: Fetch rustarmic (CPU JIT dependency)
        shell: bash
        run: git clone --depth 1 --branch "$RUSTARMIC_REF" "$RUSTARMIC_URL" ../rustarmic

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build NeXium
        run: cargo build -p nexium-gui
