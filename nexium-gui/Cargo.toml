[package]
name = "nexium-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "nexium"
path = "src/main.rs"

[[bin]]
name = "debug_boot"
path = "src/debug_boot.rs"

[[bin]]
name = "debug_continue"
path = "src/debug_continue.rs"

[dependencies]
nexium-common.workspace = true
nexium-memory.workspace = true
nexium-core = { workspace = true, default-features = false }
nexium-cpu = { workspace = true, default-features = false }
nexium-gpu.workspace = true
nexium-loader.workspace = true
nexium-runner = { path = "../nexium-runner", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono.workspace = true

# wgpu (Vulkan/DX12) backend in addition to the default glow (OpenGL). The GUI
# runs on wgpu (see NativeOptions.renderer) so the NVIDIA OpenGL ICD
# (nvoglv64.dll) is never loaded — it was crashing alongside the guest's Vulkan
# renderer. glow stays compiled as a fallback selectable via the renderer field.
eframe = { version = "0.36", features = ["wgpu"] }
egui = "0.36"
winit = "0.30"
rfd = "0.17"
arboard = "3"

cpal = "0.18"
getrandom = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
ringbuf = { workspace = true }
nexium-kernel = { workspace = true, default-features = false }
once_cell = { workspace = true }
parking_lot = "0.12"
crossbeam = "0.8"

log = "0.4"
env_logger = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sdl3 = { version = "0.18.4", default-features = false, features = ["build-from-source-static"] }

[features]
default = ["backend-dynarmic", "backend-rustarmic"]
backend-dynarmic = ["nexium-core/backend-dynarmic", "nexium-cpu/backend-dynarmic", "nexium-runner/backend-dynarmic"]
backend-rustarmic = ["nexium-core/backend-rustarmic", "nexium-cpu/backend-rustarmic", "nexium-runner/backend-rustarmic"]

