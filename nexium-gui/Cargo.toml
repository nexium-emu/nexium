[package]
name = "nexium-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "nexium"
path = "src/main.rs"

[[bin]]
name = "debug_boot"
path = "src/debug_boot.rs"

[[bin]]
name = "debug_continue"
path = "src/debug_continue.rs"

[dependencies]
nexium-common.workspace = true
nexium-core = { workspace = true, default-features = false }
nexium-gpu.workspace = true

eframe = "0.29"
egui = "0.29"
winit = "0.30"
rfd = "0.15"

cpal = "0.15"
gilrs = "0.10"
parking_lot = "0.12"
crossbeam = "0.8"

log = "0.4"
env_logger = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[features]
default = ["backend-dynarmic"]
backend-dynarmic = ["nexium-core/backend-dynarmic"]
backend-rustarmic = ["nexium-core/backend-rustarmic"]

