[workspace]
resolver = "2"
members = [
    "nexium-common",
    "nexium-memory",
    "nexium-cpu",
    "nexium-loader",
    "nexium-shader",
    "nexium-spirv",
    "nexium-ipc",
    "nexium-cmif-macros",
    "nexium-cmif",
    "nexium-nvdrv",
    "nexium-kernel",
    "nexium-core",
    "nexium-gpu",
    "nexium-gui",
    "nexium-runner",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
nexium-common = { path = "nexium-common" }
nexium-memory = { path = "nexium-memory" }
nexium-cpu = { path = "nexium-cpu", default-features = false }
nexium-loader = { path = "nexium-loader" }
nexium-shader = { path = "nexium-shader" }
nexium-spirv = { path = "nexium-spirv" }
nexium-ipc = { path = "nexium-ipc" }
nexium-cmif = { path = "nexium-cmif" }
nexium-nvdrv = { path = "nexium-nvdrv" }
nexium-kernel = { path = "nexium-kernel", default-features = false }
nexium-core = { path = "nexium-core", default-features = false }
nexium-gpu = { path = "nexium-gpu" }

bytemuck = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
modular-bitfield = "0.13"
bitflags = "2"
num_enum = "0.7"
byteorder = "1"

aes = "0.9"
lz4_flex = { version = "0.14", default-features = false }

parking_lot = "0.12"
crossbeam = "0.8"

thiserror = "2"
log = "0.4"
env_logger = "0.11"

rspirv = "0.13"
naga = { version = "30.0", features = ["spv-in"] }
ringbuf = "0.5"
directories = "6"
chrono = "0.4"
once_cell = "1.20"
memmap2 = "0.9"

dynarmic-sys-mythrax = "0.3.0"

[profile.dev]
opt-level = 1



[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
