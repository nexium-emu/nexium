[workspace]
resolver = "2"
members = [
    "nexium-common",
    "nexium-memory",
    "nexium-cpu",
    "nexium-loader",
    "nexium-shader",
    "nexium-spirv",
    "nexium-ipc",
    "nexium-cmif-macros",
    "nexium-cmif",
    "nexium-nvdrv",
    "nexium-kernel",
    "nexium-core",
    "nexium-gpu",
    "nexium-gui",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "GPL-2.0-or-later"

[workspace.dependencies]
nexium-common = { path = "nexium-common" }
nexium-memory = { path = "nexium-memory" }
nexium-cpu = { path = "nexium-cpu" }
nexium-loader = { path = "nexium-loader" }
nexium-shader = { path = "nexium-shader" }
nexium-ipc = { path = "nexium-ipc" }
nexium-cmif = { path = "nexium-cmif" }
nexium-nvdrv = { path = "nexium-nvdrv" }
nexium-kernel = { path = "nexium-kernel" }
nexium-core = { path = "nexium-core" }
nexium-gpu = { path = "nexium-gpu" }

bytemuck = { version = "1", features = ["derive"] }
zerocopy = { version = "0.7", features = ["derive"] }
modular-bitfield = "0.11"
bitflags = "2"
num_enum = "0.7"
byteorder = "1"

aes = "0.8"
lz4_flex = { version = "0.11", default-features = false }

parking_lot = "0.12"
crossbeam = "0.8"

thiserror = "1"
log = "0.4"
env_logger = "0.11"

ash = "0.38"
gpu-allocator = "0.27"
raw-window-handle = "0.6"
winit = "0.30"

rspirv = "0.12"
naga = { version = "0.14", features = ["spv-in"] }

eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
rfd = "0.15"

cpal = "0.15"
gilrs = "0.10"

serde = { version = "1", features = ["derive"] }
directories = "5"
chrono = "0.4"
once_cell = "1.20"
memmap2 = "0.9"

sdl2 = "0.37"

dynarmic-sys-mythrax = "0.2.6"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
