[package]
name = "horizonrust-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "horizonrust"
path = "src/main.rs"

[[bin]]
name = "debug_boot"
path = "src/debug_boot.rs"

[[bin]]
name = "debug_continue"
path = "src/debug_continue.rs"

[dependencies]
horizonrust-common.workspace = true
horizonrust-core.workspace = true
horizonrust-gpu.workspace = true

eframe = "0.29"
egui = "0.29"
winit = "0.30"
rfd = "0.15"

cpal = "0.15"
gilrs = "0.10"
parking_lot = "0.12"
crossbeam = "0.8"

log = "0.4"
env_logger = "0.11"

serde = { version = "1", features = ["derive"] }

