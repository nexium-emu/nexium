[package]
name = "nexium-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
opus = "0.4"
nexium-common.workspace = true
nexium-memory.workspace = true
nexium-cpu = { workspace = true, default-features = false }
nexium-loader.workspace = true
nexium-shader.workspace = true
nexium-ipc.workspace = true
nexium-cmif.workspace = true
nexium-nvdrv.workspace = true
nexium-gpu.workspace = true

bytemuck.workspace = true
zerocopy.workspace = true
modular-bitfield.workspace = true
bitflags.workspace = true
num_enum.workspace = true
byteorder.workspace = true

aes.workspace = true
lz4_flex.workspace = true

parking_lot.workspace = true
crossbeam.workspace = true

log.workspace = true
thiserror.workspace = true
once_cell.workspace = true
memmap2.workspace = true
getrandom = "0.4"
opusic-sys = "=0.7.5"

directories.workspace = true
socket2 = "0.6"

[target.'cfg(not(target_vendor = "sony"))'.dependencies]
base64 = "0.23"
rsa = { version = "0.9", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = { version = "0.10", features = ["oid"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[features]
default = ["backend-dynarmic", "backend-rustarmic"]
backend-dynarmic = ["nexium-cpu/backend-dynarmic"]
backend-rustarmic = ["nexium-cpu/backend-rustarmic"]
backend-nce = ["nexium-cpu/backend-nce"]
