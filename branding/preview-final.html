<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeXium logo — final</title>
<style>
  body { background: #0a0a12; color: #e6e6f0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 32px; }
  h1 { margin: 0 0 4px; font-weight: 500; }
  .sub { color: #888; margin-bottom: 32px; font-size: 14px; }
  .row { display: flex; gap: 28px; align-items: flex-end; margin-bottom: 32px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .col span { font-size: 11px; color: #666; margin-top: 8px; }
  .light { background: #fff; padding: 16px 24px; border-radius: 12px; display: inline-flex; gap: 18px; align-items: center; color: #222; font-size: 13px; }
  .taskbar { background: #1f1f1f; padding: 10px 20px; border-radius: 10px; display: inline-flex; gap: 16px; align-items: center; margin-top: 24px; }
  .taskbar img { width: 32px; height: 32px; }
  .taskbar span { font-size: 13px; color: #ccc; }
</style>
</head>
<body>
  <h1>NeXium</h1>
  <div class="sub">Final polish on variant C. Glow on core only, orbits crisp; ±30° crossing reads more atom-like at small sizes.</div>

  <div class="row">
    <div class="col"><img src="logo.svg" width="512" height="512"><span>512 — store / about page</span></div>
    <div class="col"><img src="logo.svg" width="256" height="256"><span>256 — installer</span></div>
    <div class="col"><img src="logo.svg" width="128" height="128"><span>128</span></div>
    <div class="col"><img src="logo.svg" width="64" height="64"><span>64</span></div>
    <div class="col"><img src="logo.svg" width="48" height="48"><span>48</span></div>
    <div class="col"><img src="logo.svg" width="32" height="32"><span>32 — taskbar</span></div>
    <div class="col"><img src="logo.svg" width="16" height="16"><span>16 — favicon</span></div>
  </div>

  <div class="light">
    <img src="logo.svg" width="48" height="48">
    <img src="logo.svg" width="32" height="32">
    <img src="logo.svg" width="16" height="16">
    <span>contrast check on white</span>
  </div>

  <div class="taskbar">
    <img src="logo.svg">
    <span>NeXium</span>
    <span style="color:#888">— Nintendo Switch Emulator</span>
  </div>
</body>
</html>
