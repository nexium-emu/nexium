<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="ring-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cf2ff"/>
      <stop offset="50%" stop-color="#3dbeff"/>
      <stop offset="100%" stop-color="#0d6fbb"/>
    </linearGradient>
    <radialGradient id="core-c" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#5cf2ff"/>
      <stop offset="100%" stop-color="#0d6fbb"/>
    </radialGradient>
    <filter id="glow-c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg-c)"/>

  <g transform="translate(128 128)" fill="none" stroke="url(#ring-c)" stroke-width="5" stroke-linecap="round" filter="url(#glow-c)">
    <ellipse rx="100" ry="34" transform="rotate(45)"/>
    <ellipse rx="100" ry="34" transform="rotate(-45)"/>
  </g>

  <circle cx="128" cy="128" r="14" fill="url(#core-c)" filter="url(#glow-c)"/>
</svg>
