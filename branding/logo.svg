<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cf2ff"/>
      <stop offset="50%" stop-color="#3dbeff"/>
      <stop offset="100%" stop-color="#0d6fbb"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#5cf2ff"/>
      <stop offset="100%" stop-color="#0d6fbb"/>
    </radialGradient>
    <filter id="core-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <g transform="translate(128 128)" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round">
    <ellipse rx="100" ry="32" transform="rotate(30)"/>
    <ellipse rx="100" ry="32" transform="rotate(-30)"/>
  </g>

  <circle cx="128" cy="128" r="16" fill="url(#core)" filter="url(#core-glow)"/>
</svg>
