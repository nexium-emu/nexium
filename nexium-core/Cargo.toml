[package]
name = "nexium-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nexium-common.workspace = true
nexium-memory.workspace = true
nexium-cpu = { workspace = true, default-features = false }
nexium-loader.workspace = true
nexium-shader.workspace = true
nexium-ipc.workspace = true
nexium-nvdrv.workspace = true
nexium-kernel = { workspace = true, default-features = false }

[dev-dependencies]
env_logger.workspace = true

[features]
default = ["backend-dynarmic", "backend-rustarmic"]
backend-dynarmic = ["nexium-cpu/backend-dynarmic", "nexium-kernel/backend-dynarmic"]
backend-rustarmic = ["nexium-cpu/backend-rustarmic", "nexium-kernel/backend-rustarmic"]
